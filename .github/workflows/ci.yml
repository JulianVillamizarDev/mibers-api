name: CI

on:
  push:
    branches: [main, julian, "HU-**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores de prueba: el runner no tiene .env y las integraciones quedan simuladas.
env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-secret-key-con-al-menos-32-bytes-de-largo
  FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  WHATSAPP_BACKEND: fake
  META_PUBLISHING: manual

jobs:
  calidad:
    name: Calidad (ruff, capas, migraciones)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: Contrato de capas (import-linter)
        run: lint-imports
      - name: Migraciones al dia
        run: python manage.py makemigrations --check --dry-run

  pruebas-sqlite:
    name: Pruebas (SQLite) y cobertura
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: pytest con cobertura minima del 90 %
        run: pytest --cov=modules --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  pruebas-postgres:
    name: Pruebas (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mibers
          POSTGRES_PASSWORD: mibers
          POSTGRES_DB: mibers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mibers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mibers:mibers@localhost:5432/mibers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Pruebas exclusivas de Postgres (trigger de auditoria, SKIP LOCKED)
        run: pytest -m postgres -ra
      - name: Suite completa sobre Postgres
        run: pytest -ra

  imagen-docker:
    name: Imagen de produccion (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD: solo en push a main y con todo el CI en verde. Dokploy construye y despliega la imagen;
  # para que no despliegue por su cuenta hay que desactivar "Auto Deploy" en la app de Dokploy.
  desplegar:
    name: Desplegar en Dokploy
    needs: [calidad, pruebas-sqlite, pruebas-postgres, imagen-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false
    steps:
      - name: Pedir el despliegue a Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APPLICATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name en el environment production."
              exit 1
            fi
          done
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${DOKPLOY_APPLICATION_ID}\"}"
          echo "Despliegue solicitado para el commit ${GITHUB_SHA}."

      # El despliegue de Dokploy es asincrono: esto confirma que la API responde de nuevo
      # despues del cambio de contenedor, no que ya corra este commit.
      - name: Comprobar /health
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_URL}" ]; then
            echo "::warning::Sin variable PROD_URL; se omite la comprobacion de /health."
            exit 0
          fi
          sleep 90
          for intento in $(seq 1 30); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${PROD_URL%/}/health" || true)
            if [ "$codigo" = "200" ]; then
              echo "/health respondio 200 (intento $intento)."
              exit 0
            fi
            echo "Intento $intento: /health respondio ${codigo:-sin respuesta}."
            sleep 15
          done
          echo "::error::/health no respondio 200 a tiempo."
          exit 1
